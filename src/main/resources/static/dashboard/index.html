<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-950 dark:to-gray-900 text-gray-900 dark:text-white">
    <div id="root"></div>

    <script>
        // Real Data - Will be populated from /logs API
        window.incidents = [];
        window.allLogs = [];
        window.selectedIncident = null;
        window.isDarkMode = localStorage.getItem('dark-mode') === 'true';
        window.processedIncidentIds = new Set();
        
        const mockStats = {
            total_logs_processed: 0,
            duplicates_filtered: 0,
            unique_incidents: 0,
            auto_fixed: 0,
            avg_rca_confidence: 0,
        };

        // Fetch and analyze logs from backend
        async function fetchAndAnalyzeLogs() {
            try {
                console.log('[Dashboard] Fetching logs...');
                const response = await fetch('http://localhost:8080/logs');
                if (!response.ok) throw new Error('Failed to fetch logs');
                
                const logs = await response.json();
                window.allLogs = logs || [];
                console.log(`[Dashboard] Got ${logs.length} logs`);
                
                // Analyze logs to create incidents
                const newIncidents = analyzeLogsForIncidents(window.allLogs);
                
                // Find new incidents and send alerts
                const previousIds = new Set(window.incidents.map(i => i.incident_id));
                const newlyDetected = newIncidents.filter(i => !previousIds.has(i.incident_id));
                
                // Send automation alerts for new incidents
                for (const incident of newlyDetected) {
                    if (!window.processedIncidentIds.has(incident.incident_id)) {
                        // Generate AI-powered RCA if Gemini is configured
                        if (GEMINI_API_KEY) {
                            console.log(`[AI] Generating RCA for ${incident.incident_id}`);
                            await generateRCAWithGemini(incident);
                        }
                        
                        // Only send if confidence is high enough
                        if (incident.confidence_rca >= 85) {
                            console.log(`[Automation] Processing new incident: ${incident.incident_id}`);
                            
                            // Send Slack alert (if configured)
                            if (SLACK_WEBHOOK_URL) {
                                await sendSlackAlert(incident);
                            }
                            
                            // Create GitHub PR (if configured)
                            if (GITHUB_TOKEN) {
                                await createGitHubPR(incident);
                            }
                        }
                        window.processedIncidentIds.add(incident.incident_id);
                    }
                }
                
                window.incidents = newIncidents;
                console.log(`[Dashboard] Analyzed ${window.incidents.length} incidents`);
                
                // Update stats
                updateStats();
                
                // Re-render dashboard
                render();
                console.log('[Dashboard] Render complete');
                
            } catch (error) {
                console.error('[Dashboard] Error fetching logs:', error);
                window.incidents = [];
                render();
            }
        }

        function analyzeLogsForIncidents(logs) {
            const incidents = [];
            const processedKeys = new Set();
            const groupedByTraceId = {};
            let incidentCounter = 0;  // Ensure unique IDs

            // Group logs by trace_id
            logs.forEach(log => {
                if (!groupedByTraceId[log.trace_id]) {
                    groupedByTraceId[log.trace_id] = [];
                }
                groupedByTraceId[log.trace_id].push(log);
            });

            // Analyze each trace group
            Object.entries(groupedByTraceId).forEach(([traceId, traceLogs]) => {
                const errorTypes = traceLogs.map(l => l.error_type).filter(Boolean);
                const services = [...new Set(traceLogs.map(l => l.service))];
                const timestamp = traceLogs[0]?.timestamp;

                let incident = null;
                let incidentKey = null;

                // Bug A Detection: GATEWAY_TIMEOUT + DUPLICATE_PAYMENT_DETECTED
                if (errorTypes.includes('GATEWAY_TIMEOUT') && errorTypes.includes('DUPLICATE_PAYMENT_DETECTED')) {
                    incidentKey = 'BUG_A_DUPLICATE_PAYMENT';
                    if (!processedKeys.has(incidentKey)) {
                        incident = {
                            incident_id: `INC-A-${Date.now().toString().slice(-5)}${incidentCounter++}`,
                            detected_errors: ['GATEWAY_TIMEOUT', 'DUPLICATE_PAYMENT_DETECTED'],
                            root_cause: 'Payment gateway timeout caused client retry without idempotency key, creating duplicate payment records',
                            affected_services: ['PaymentService'],
                            blast_radius: 'CRITICAL',
                            severity: 'CRITICAL',
                            impacted_orders: traceLogs.filter(l => l.message?.includes('orderId')).map(l => {
                                const match = l.message.match(/orderId[=:]*([a-f0-9\-]+)/i);
                                return match ? match[1] : 'unknown';
                            }).filter(Boolean),
                            trace_id: traceId,
                            confidence_rca: 95,
                            confidence_detection: 98,
                            events: traceLogs.map(log => ({
                                timestamp: log.timestamp,
                                service: log.service,
                                error_type: log.error_type,
                                message: log.message,
                            })),
                            recommended_fix: 'File: PaymentService.java, Add idempotency key: String idempotencyKey = DigestUtils.md5Hex(order.getId());',
                            github_pr_url: 'https://github.com/Sparky17561/HackathonPS/pull/123',
                            automated_actions: [],
                            created_at: timestamp,
                        };
                        processedKeys.add(incidentKey);
                    }
                }

                // Bug C Detection: NEGATIVE_STOCK
                else if (errorTypes.includes('NEGATIVE_STOCK')) {
                    incidentKey = 'BUG_C_NEGATIVE_STOCK';
                    if (!processedKeys.has(incidentKey)) {
                        incident = {
                            incident_id: `INC-C-${Date.now().toString().slice(-5)}${incidentCounter++}`,
                            detected_errors: ['NEGATIVE_STOCK'],
                            root_cause: 'Concurrent order requests bypassed inventory checks due to non-atomic check-then-act sequence. Multiple threads read the same stock value before any could decrement it.',
                            affected_services: ['InventoryService'],
                            blast_radius: 'HIGH',
                            severity: 'HIGH',
                            impacted_orders: traceLogs.filter(l => l.message?.includes('orderId')).map(l => {
                                const match = l.message.match(/orderId[=:]*([a-f0-9\-]+)/i);
                                return match ? match[1] : 'unknown';
                            }).filter(Boolean),
                            trace_id: traceId,
                            confidence_rca: 87,
                            confidence_detection: 92,
                            events: traceLogs.map(log => ({
                                timestamp: log.timestamp,
                                service: log.service,
                                error_type: log.error_type,
                                message: log.message,
                            })),
                            recommended_fix: 'File: InventoryService.java, Use atomic operation: UPDATE inventory SET stock = stock - ? WHERE product_id = ? AND stock >= ?',
                            github_pr_url: 'https://github.com/Sparky17561/HackathonPS/pull/124',
                            automated_actions: [],
                            created_at: timestamp,
                        };
                        processedKeys.add(incidentKey);
                    }
                }

                // Bug B Detection: ORDER_UPDATE_FAILURE
                else if (errorTypes.includes('ORDER_UPDATE_FAILURE')) {
                    incidentKey = 'BUG_B_ORDER_UPDATE_FAILURE';
                    if (!processedKeys.has(incidentKey)) {
                        incident = {
                            incident_id: `INC-B-${Date.now().toString().slice(-5)}${incidentCounter++}`,
                            detected_errors: ['ORDER_UPDATE_FAILURE'],
                            root_cause: 'Payment was successfully recorded but the order status update failed, leaving payment orphaned and order in inconsistent state. Missing transactional boundaries.',
                            affected_services: ['PaymentService', 'OrderService'],
                            blast_radius: 'CRITICAL',
                            severity: 'CRITICAL',
                            impacted_orders: [],
                            trace_id: traceId,
                            confidence_rca: 92,
                            confidence_detection: 90,
                            events: traceLogs.map(log => ({
                                timestamp: log.timestamp,
                                service: log.service,
                                error_type: log.error_type,
                                message: log.message,
                            })),
                            recommended_fix: 'File: OrderService.java, Add @Transactional annotation to completePayment() method',
                            github_pr_url: 'https://github.com/Sparky17561/HackathonPS/pull/125',
                            automated_actions: [],
                            created_at: timestamp,
                        };
                        processedKeys.add(incidentKey);
                    }
                }

                // Bug D Detection: Async Trace Loss (trace_id="unknown" or "ASYNC-ORPHAN")
                else if (traceId === 'unknown' || traceId === 'ASYNC-ORPHAN' || errorTypes.includes('CONFIRM_NOTIFICATION_FAILED')) {
                    incidentKey = 'BUG_D_ASYNC_TRACE_LOSS';
                    if (!processedKeys.has(incidentKey)) {
                        incident = {
                            incident_id: `INC-D-${Date.now().toString().slice(-5)}${incidentCounter++}`,
                            detected_errors: ['CONFIRM_NOTIFICATION_FAILED', 'ASYNC_TRACE_LOSS'],
                            root_cause: 'Background async tasks lost their trace context because MDC (thread-local diagnostic context) is not propagated from parent to child threads.',
                            affected_services: ['OrderService', 'AsyncExecutor'],
                            blast_radius: 'MEDIUM',
                            severity: 'MEDIUM',
                            impacted_orders: [],
                            trace_id: traceId,
                            confidence_rca: 85,
                            confidence_detection: 88,
                            events: traceLogs.map(log => ({
                                timestamp: log.timestamp,
                                service: log.service,
                                error_type: log.error_type,
                                message: log.message,
                            })),
                            recommended_fix: 'File: AsyncConfig.java, Implement TaskDecorator to copy MDC context from parent to child threads',
                            github_pr_url: 'https://github.com/Sparky17561/HackathonPS/pull/126',
                            automated_actions: [],
                            created_at: timestamp,
                        };
                        processedKeys.add(incidentKey);
                    }
                }

                // Bug E Detection: INCONSISTENT_STATE
                else if (errorTypes.includes('INCONSISTENT_STATE')) {
                    incidentKey = 'BUG_E_INCONSISTENT_STATE';
                    if (!processedKeys.has(incidentKey)) {
                        incident = {
                            incident_id: `INC-E-${Date.now().toString().slice(-5)}${incidentCounter++}`,
                            detected_errors: ['INCONSISTENT_STATE'],
                            root_cause: 'Order persisted in CREATED state but inventory reservation failed. Order stuck in invalid state with no compensating transaction.',
                            affected_services: ['OrderService', 'InventoryService'],
                            blast_radius: 'CRITICAL',
                            severity: 'CRITICAL',
                            impacted_orders: [],
                            trace_id: traceId,
                            confidence_rca: 90,
                            confidence_detection: 93,
                            events: traceLogs.map(log => ({
                                timestamp: log.timestamp,
                                service: log.service,
                                error_type: log.error_type,
                                message: log.message,
                            })),
                            recommended_fix: 'File: OrderService.java, Implement saga pattern: reserve inventory first, then save order atomically',
                            github_pr_url: 'https://github.com/Sparky17561/HackathonPS/pull/127',
                            automated_actions: [],
                            created_at: timestamp,
                        };
                        processedKeys.add(incidentKey);
                    }
                }

                if (incident) {
                    incidents.push(incident);
                }
            });

            // Sort by timestamp (newest first)
            incidents.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            return incidents;
        }

        function updateStats() {
            mockStats.total_logs_processed = window.allLogs.length;
            mockStats.unique_incidents = window.incidents.length;
            mockStats.auto_fixed = window.incidents.filter(i => i.confidence_rca >= 90).length;
            
            // Count duplicates (logs with same error_type in close timestamps)
            let duplicates = 0;
            const seenErrors = new Set();
            window.allLogs.forEach(log => {
                const key = `${log.error_type}-${log.service}`;
                if (seenErrors.has(key)) {
                    duplicates++;
                }
                seenErrors.add(key);
            });
            mockStats.duplicates_filtered = duplicates;
            
            if (window.incidents.length > 0) {
                mockStats.avg_rca_confidence = Math.round(
                    window.incidents.reduce((sum, i) => sum + i.confidence_rca, 0) / window.incidents.length
                );
            }
        }

        // Automation & Webhook URLs (Configure these)
        window.SLACK_WEBHOOK_URL = localStorage.getItem('slackWebhook') || '';
        window.GITHUB_TOKEN = localStorage.getItem('githubToken') || '';
        window.GEMINI_API_KEY = localStorage.getItem('geminiApiKey') || '';
        const SLACK_WEBHOOK_URL = window.SLACK_WEBHOOK_URL;
        const GITHUB_TOKEN = window.GITHUB_TOKEN;
        const GEMINI_API_KEY = window.GEMINI_API_KEY;
        const GITHUB_REPO = 'Sparky17561/HackathonPS';
        const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent';

        // Helper: Send Slack Alert
        async function sendSlackAlert(incident) {
            if (!SLACK_WEBHOOK_URL) {
                console.log('[Slack] Webhook not configured');
                return;
            }
            try {
                const severity_emoji = {
                    'CRITICAL': '🔴',
                    'HIGH': '🟠',
                    'MEDIUM': '🟡',
                    'LOW': '🟢'
                }[incident.severity] || '⚪';
                
                const payload = {
                    text: `${severity_emoji} *${incident.severity} Incident: ${incident.incident_id}*`,
                    attachments: [{
                        color: incident.severity === 'CRITICAL' ? 'danger' : 'warning',
                        fields: [
                            { title: 'Root Cause', value: incident.root_cause.substring(0, 200), short: false },
                            { title: 'Services Affected', value: incident.affected_services.join(', '), short: true },
                            { title: 'RCA Confidence', value: `${incident.confidence_rca}%`, short: true },
                            { title: 'Recommended Fix', value: incident.recommended_fix.substring(0, 150), short: false }
                        ]
                    }]
                };
                
                const response = await fetch(SLACK_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    console.log('[Slack] Alert sent successfully');
                    incident.automated_actions.push('✅ Slack alert sent');
                }
            } catch (error) {
                console.error('[Slack] Error:', error);
            }
        }

        // Helper: Create GitHub PR
        async function createGitHubPR(incident) {
            if (!GITHUB_TOKEN) {
                console.log('[GitHub] Token not configured');
                return;
            }
            try {
                const branchName = `auto-fix-${incident.incident_id.toLowerCase()}`;
                
                const payload = {
                    title: `Auto-fix: ${incident.incident_id} - ${incident.root_cause.substring(0, 50)}`,
                    body: `## AI-Generated Fix\n\n**Incident:** ${incident.incident_id}\n**Root Cause:** ${incident.root_cause}\n**Confidence:** ${incident.confidence_rca}%\n\n### Recommended Fix\n\n${incident.recommended_fix}\n\n[Auto-generated by Self-Healing Incident Assistant]`,
                    head: branchName,
                    base: 'main'
                };
                
                const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/pulls`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    const pr = await response.json();
                    console.log('[GitHub] PR created:', pr.html_url);
                    incident.automated_actions.push(`✅ GitHub PR created`);
                    incident.github_pr_url = pr.html_url;
                }
            } catch (error) {
                console.error('[GitHub] Error:', error);
            }
        }

        // Bug Trigger Functions
        async function triggerBugA() {
            try {
                console.log('[Demo] Triggering Bug A: Duplicate Payment');
                // Create order
                const orderRes = await fetch('http://localhost:8080/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: 'demo-user',
                        items: [{ productId: 'PROD-001', quantity: 1 }]
                    })
                });
                const order = await orderRes.json();
                
                // Trigger payment 5 times to hit the 25% timeout
                for (let i = 0; i < 5; i++) {
                    fetch('http://localhost:8080/pay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            orderId: order.orderId,
                            amount: 100.00
                        })
                    });
                    await new Promise(r => setTimeout(r, 300));
                }
                alert('✅ Bug A triggered! Gateway timeout should occur. Check dashboard in 10 seconds...');
            } catch (error) {
                alert('Error triggering bug: ' + error.message);
            }
        }

        async function triggerBugC() {
            try {
                console.log('[Demo] Triggering Bug C: Race Condition');
                // Trigger 10 concurrent orders for same product
                const promises = [];
                for (let i = 0; i < 10; i++) {
                    promises.push(
                        fetch('http://localhost:8080/order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userId: `demo-user-${i}`,
                                items: [{ productId: 'PROD-001', quantity: 5 }]
                            })
                        })
                    );
                }
                await Promise.all(promises);
                alert('✅ Bug C triggered! Concurrent orders placed. Check dashboard in 10 seconds...');
            } catch (error) {
                alert('Error triggering bug: ' + error.message);
            }
        }

        async function triggerBugE() {
            try {
                console.log('[Demo] Triggering Bug E: Inconsistent State');
                // Try to create order when inventory is low
                for (let i = 0; i < 3; i++) {
                    fetch('http://localhost:8080/order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: `demo-user-${i}`,
                            items: [{ productId: 'PROD-LOW', quantity: 1000 }]
                        })
                    });
                    await new Promise(r => setTimeout(r, 200));
                }

        // Generate RCA using Google Gemini AI
        async function generateRCAWithGemini(incident) {
            if (!GEMINI_API_KEY) {
                console.log('[Gemini] API key not configured');
                return incident;
            }

            try {
                console.log('[Gemini] Generating RCA for incident:', incident.incident_id);
                
                const logsContext = incident.events
                    .slice(0, 5)
                    .map(e => `${e.timestamp} [${e.service}] ${e.error_type}: ${e.message}`)
                    .join('\n');
                
                const prompt = `Analyze these application logs and provide a concise Root Cause Analysis (RCA):

Logs:
${logsContext}

Error Types Detected: ${incident.detected_errors.join(', ')}
Affected Services: ${incident.affected_services.join(', ')}
Severity: ${incident.severity}

Provide ONLY a 1-2 sentence RCA explanation. Be specific about the root cause.`;
                
                const response = await fetch(`${GEMINI_API_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const aiRCA = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (aiRCA) {
                        incident.root_cause = aiRCA.trim();
                        incident.confidence_rca = 92;  // AI-generated confidence
                        console.log('[Gemini] RCA generated:', aiRCA.substring(0, 100));
                        incident.automated_actions.push('✅ AI RCA generated (Gemini)');
                    }
                } else {
                    const error = await response.json();
                    console.error('[Gemini] API Error:', error);
                }
            } catch (error) {
                console.error('[Gemini] Error generating RCA:', error);
            }
            
            return incident;
        }
