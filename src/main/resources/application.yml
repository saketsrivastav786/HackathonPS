server:
  port: 8080

spring:
  application:
    name: hacksys-backend
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  config: classpath:logback-spring.xml

app:
  inventory:
    initial-stock: 50
  payment:
    timeout-ms: 3000
  chaos:
    intermittent-failure-rate: 0.25
  alerting:
    slack-webhook-url: ""
    trace-incident-threshold: 3
    service-error-threshold: 2
    incident-window-ms: 60000
